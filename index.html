<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ProLet Neural Circuit Precision Challenge - IANCON Demo</title>
  
  <style>
    :root {
      --prolet-blue: #2b62a8;
      --prolet-red: #ef3b42;
      --prolet-dark: #0b0c0e;
      --prolet-card: #18191b;
      --prolet-card-border: #2a2d32;
      
      --accent-green: #2ed573;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--prolet-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 16px 32px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .brand-logo-wrapper {
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 2px solid var(--prolet-blue);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 10px rgba(43, 98, 168, 0.3);
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .brand-logo {
      max-height: 52px;
      max-width: 240px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: none;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1.5px;
      color: var(--prolet-blue);
      text-transform: uppercase;
      font-weight: 800;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 650px;
    }

    .mode-btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--prolet-card);
      color: var(--text-main);
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active-pre {
      border-color: var(--prolet-red);
      box-shadow: 0 0 12px rgba(239, 59, 66, 0.4);
      background: #2a1012;
      color: #fff;
    }

    .mode-btn.active-post {
      border-color: var(--prolet-blue);
      box-shadow: 0 0 12px rgba(43, 98, 168, 0.5);
      background: #0f1d30;
      color: #fff;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--prolet-card-border);
      margin-bottom: 12px;
    }

    .health-container {
      width: 50%;
      background: #000;
      height: 22px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .health-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--prolet-red), var(--prolet-blue));
      transition: width 0.1s linear;
    }

    .metrics {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .metric-box {
      text-align: center;
    }

    .metric-box span.label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      font-weight: bold;
    }

    .metric-box span.val {
      font-size: 1.2rem;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 420px;
      background: #18191b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--prolet-card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      background-color: #18191b;
      z-index: 1;
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 14, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(4px);
      z-index: 10;
      pointer-events: auto;
    }

    .overlay.hidden {
      display: none !important;
      pointer-events: none !important;
    }

    .overlay h2 {
      font-size: 1.7rem;
      margin-bottom: 12px;
    }

    .overlay p {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    .input-group input {
      background: #000;
      border: 1px solid var(--prolet-card-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-group input:focus {
      border-color: var(--prolet-blue);
    }

    .btn-action {
      background: var(--prolet-blue);
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 14px 32px;
      border-radius: 24px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43, 98, 168, 0.4);
      transition: all 0.2s;
    }

    .btn-action:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-action:not(:disabled):active {
      background: #20497e;
    }

    #video-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .skip-video-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid var(--prolet-card-border);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 25;
    }

    .leaderboard-card {
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      border: 1px solid var(--prolet-card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .leaderboard-card h3 {
      font-size: 1.15rem;
      color: var(--prolet-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .leaderboard-actions {
      display: flex;
      gap: 8px;
    }

    .share-btn, .reset-btn {
      background: #2a2d32;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn {
      color: var(--prolet-red);
      border-color: rgba(239, 59, 66, 0.3);
    }

    .share-btn:active, .reset-btn:active {
      background: #333840;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101114;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: var(--text-muted);
      width: 28px;
    }

    .leaderboard-item .name {
      flex: 1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
    }

    .leaderboard-item .stats-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard-item .time-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .leaderboard-item .score {
      font-weight: bold;
      color: var(--accent-green);
      font-size: 1.05rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo-wrapper">
      <img 
        src="logo.png" 
        alt="ProLet Logo" 
        class="brand-logo"
        onerror="this.parentElement.style.display='none';"
      />
    </div>
    <h1>Neural Circuit Challenge</h1>
    <p class="subtitle">Essential Tremor Simulation & Assessment Demo</p>
  </header>

  <div class="controls-panel">
    <button id="btn-pre" class="mode-btn active-pre">Pre-Treatment</button>
    <button id="btn-post" class="mode-btn">Post-ProLet</button>
  </div>

  <div class="status-bar">
    <div style="width: 45%;">
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block; font-weight: bold; margin-bottom: 2px;">STABILITY</span>
      <div class="health-container" style="width: 100%;">
        <div id="health-bar" class="health-bar"></div>
      </div>
    </div>
    
    <div class="metrics">
      <div class="metric-box">
        <span class="label">TIME</span>
        <span id="timer-count" class="val" style="color: #fff; font-family: monospace;">0.0s</span>
      </div>
      <div class="metric-box">
        <span class="label">ERRORS</span>
        <span id="error-count" class="val" style="color: var(--prolet-red);">0</span>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="mazeCanvas"></canvas>
    
    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <h2>Trace the Circuit</h2>
      <p id="overlay-instructions">Click/touch and drag from <strong>GABA</strong> to <strong>GABA Receptor</strong> without touching the circuit walls.</p>
      
      <div id="input-container" class="input-group hidden">
        <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="15" />
      </div>

      <button id="start-btn" class="btn-action">Begin Challenge</button>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay" class="hidden">
      <button id="skip-video-btn" class="skip-video-btn">Skip</button>
      <video id="prolet-video" src="video.mp4" playsinline></video>
    </div>

    <!-- End Overlay -->
    <div id="end-overlay" class="overlay hidden">
      <h2 id="result-title">Circuit Completed!</h2>
      <p id="result-desc"></p>
      <button id="retry-btn" class="btn-action">Try Again</button>
    </div>
  </div>

  <div class="leaderboard-card">
    <div class="leaderboard-header">
      <h3>Leaderboard (Post-ProLet)</h3>
      <div class="leaderboard-actions">
        <button id="reset-scores-btn" class="reset-btn">Reset Scores</button>
        <button id="share-link-btn" class="share-btn">Copy Link</button>
      </div>
    </div>
    <ul id="leaderboard-list" class="leaderboard-list">
      <li class="leaderboard-item"><span>No scores available</span></li>
    </ul>
  </div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    const btnPre = document.getElementById('btn-pre');
    const btnPost = document.getElementById('btn-post');
    const healthBar = document.getElementById('health-bar');
    const errorCountEl = document.getElementById('error-count');
    const timerCountEl = document.getElementById('timer-count');
    const startOverlay = document.getElementById('start-overlay');
    const endOverlay = document.getElementById('end-overlay');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const playerNameInput = document.getElementById('player-name');
    const inputContainer = document.getElementById('input-container');
    const leaderboardList = document.getElementById('leaderboard-list');
    const shareLinkBtn = document.getElementById('share-link-btn');
    const resetScoresBtn = document.getElementById('reset-scores-btn');
    const overlayInstructions = document.getElementById('overlay-instructions');

    const videoOverlay = document.getElementById('video-overlay');
    const proletVideo = document.getElementById('prolet-video');
    const skipVideoBtn = document.getElementById('skip-video-btn');

    const STORAGE_KEY = 'prolet_leaderboard_scores';

    let audioCtx = null;
    let lastBuzzTime = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    
    function playBuzzSound() {
      const now = performance.now();
      if (now - lastBuzzTime < 120) return;
      lastBuzzTime = now;

      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.60, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playSuccessSound() {
      initAudio();

      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.1);

        gain.gain.setValueAtTime(0.0, now + idx * 0.1);
        gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.1);
        osc.stop(now + idx * 0.1 + 0.45);
      });
    }

    function triggerHaptic() {
      if ('vibrate' in navigator) navigator.vibrate(40);
    }

    let mode = 'pre';
    let isPlaying = false;
    let isTouching = false;
    let health = 100;
    let errors = 0;
    let globalScores = [];
    
    let startTime = 0;
    let elapsedTime = 0;
    let isTimerRunning = false;

    let currentPos = { x: 0, y: 0 };
    let rawPos = { x: 0, y: 0 };
    const cursorRadius = 10;
    
    const waypoints = [
      { x: 0.18, y: 0.18 },
      { x: 0.82, y: 0.18 },
      { x: 0.82, y: 0.50 },
      { x: 0.18, y: 0.50 },
      { x: 0.18, y: 0.82 },
      { x: 0.82, y: 0.82 }
    ];
    
    let pathWidth = 52;
    let nodeRadius = 58;

    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const rect = container.getBoundingClientRect();

      const w = Math.max(300, rect.width || 650);
      const h = Math.max(250, rect.height || 420);

      canvas.width = w;
      canvas.height = h;

      pathWidth = Math.max(42, Math.min(60, Math.min(canvas.width, canvas.height) * 0.13));
      nodeRadius = Math.max(46, Math.min(64, Math.min(canvas.width, canvas.height) * 0.14));
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      drawCircuit();
    });

    playerNameInput.addEventListener('input', () => {
      if (mode === 'post') {
        startBtn.disabled = playerNameInput.value.trim().length === 0;
      }
    });

    function updateOverlayUI() {
      if (mode === 'pre') {
        overlayInstructions.innerHTML = 'Click/touch and drag from <strong style="color:var(--prolet-red)">GABA</strong> to <strong style="color:var(--accent-green)">GABA Receptor</strong> without touching the circuit walls.';
        inputContainer.classList.add('hidden');
        startBtn.disabled = false;
      } else {
        overlayInstructions.innerHTML = 'Click/touch and drag from <strong style="color:var(--prolet-blue)">PROLET</strong> to <strong style="color:var(--accent-green)">GABA Receptor</strong> without touching the circuit walls.';
        inputContainer.classList.remove('hidden');
        startBtn.disabled = playerNameInput.value.trim().length === 0;
      }
    }

    function playPostProletVideo(onComplete) {
      videoOverlay.classList.remove('hidden');
      proletVideo.currentTime = 0;
      proletVideo.play().catch(() => {
        closeVideoOverlay();
        onComplete();
      });

      function closeVideoOverlay() {
        proletVideo.pause();
        videoOverlay.classList.add('hidden');
        proletVideo.onended = null;
        skipVideoBtn.onclick = null;
      }

      proletVideo.onended = () => {
        closeVideoOverlay();
        onComplete();
      };

      skipVideoBtn.onclick = () => {
        closeVideoOverlay();
        onComplete();
      };
    }

    btnPre.addEventListener('click', () => {
      mode = 'pre';
      btnPre.classList.add('active-pre');
      btnPost.classList.remove('active-post');
      updateOverlayUI();
      resetGame();
    });

    btnPost.addEventListener('click', () => {
      btnPost.classList.add('active-post');
      btnPre.classList.remove('active-pre');
      
      playPostProletVideo(() => {
        mode = 'post';
        updateOverlayUI();
        resetGame();
      });
    });

    function applyTremor(pos) {
      if (mode === 'post') return { ...pos };
      const time = performance.now() * 0.025;
      const amplitude = 16.0;
      return {
        x: pos.x + (Math.sin(time * 1.3) + Math.cos(time * 2.1)) * amplitude,
        y: pos.y + (Math.cos(time * 1.7) + Math.sin(time * 2.4)) * amplitude
      };
    }

    function getScaledWaypoints() {
      return waypoints.map(wp => ({ x: wp.x * canvas.width, y: wp.y * canvas.height }));
    }

    function drawOutlinedText(text, x, y, font, fillStyle) {
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.strokeText(text, x, y);
      ctx.fillStyle = fillStyle;
      ctx.fillText(text, x, y);
    }

    function drawCircuit() {
      ctx.fillStyle = '#18191b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const scaledWp = getScaledWaypoints();

      ctx.beginPath();
      ctx.moveTo(scaledWp[0].x, scaledWp[0].y);
      for (let i = 1; i < scaledWp.length; i++) ctx.lineTo(scaledWp[i].x, scaledWp[i].y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = pathWidth + 10;
      ctx.strokeStyle = '#2a2d32';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(scaledWp[0].x, scaledWp[0].y);
      for (let i = 1; i < scaledWp.length; i++) ctx.lineTo(scaledWp[i].x, scaledWp[i].y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = pathWidth;
      ctx.strokeStyle = '#101114';
      ctx.stroke();

      const startLabel = mode === 'pre' ? 'GABA' : 'PROLET';
      ctx.beginPath();
      ctx.arc(scaledWp[0].x, scaledWp[0].y, nodeRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#2b62a8';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      const fontSize = Math.max(13, Math.floor(canvas.width * 0.032));
      drawOutlinedText(startLabel, scaledWp[0].x, scaledWp[0].y, `bold ${fontSize}px sans-serif`, '#ffffff');

      const endWp = scaledWp[scaledWp.length - 1];
      ctx.beginPath();
      ctx.arc(endWp.x, endWp.y, nodeRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#2ed573';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      drawOutlinedText('GABA Receptor', endWp.x, endWp.y, `bold ${Math.max(11, fontSize - 2)}px sans-serif`, '#ffffff');
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function isInsideCorridor(point) {
      const scaledWp = getScaledWaypoints();
      const maxDist = (pathWidth / 2) - cursorRadius;
      
      for (let i = 0; i < scaledWp.length - 1; i++) {
        if (distToSegment(point, scaledWp[i], scaledWp[i + 1]) <= maxDist) return true;
      }
      
      if (Math.hypot(point.x - scaledWp[0].x, point.y - scaledWp[0].y) <= nodeRadius - cursorRadius) return true;
      const goalWp = scaledWp[scaledWp.length - 1];
      if (Math.hypot(point.x - goalWp.x, point.y - goalWp.y) <= nodeRadius - cursorRadius) return true;

      return false;
    }

    function updatePhysics() {
      if (!isPlaying || !isTouching) return;

      if (isTimerRunning) {
        elapsedTime = (performance.now() - startTime) / 1000;
        timerCountEl.textContent = elapsedTime.toFixed(1) + 's';
      }

      const target = applyTremor(rawPos);
      const steps = 15;
      let hitWall = false;

      let nextX = currentPos.x;
      let nextY = currentPos.y;

      for (let i = 1; i <= steps; i++) {
        const testX = currentPos.x + (target.x - currentPos.x) * (i / steps);
        const testY = currentPos.y + (target.y - currentPos.y) * (i / steps);

        if (isInsideCorridor({ x: testX, y: testY })) {
          nextX = testX;
          nextY = testY;
        } else {
          hitWall = true;
          break;
        }
      }

      currentPos.x = nextX;
      currentPos.y = nextY;

      if (hitWall) {
        health = Math.max(0, health - 1.2);
        errors++;
        errorCountEl.textContent = Math.floor(errors / 3);
        healthBar.style.width = health + '%';

        playBuzzSound();
        triggerHaptic();

        if (health <= 0) {
          endGame(false);
          return;
        }
      }

      const scaledWp = getScaledWaypoints();
      const goal = scaledWp[scaledWp.length - 1];
      if (Math.hypot(currentPos.x - goal.x, currentPos.y - goal.y) < nodeRadius) {
        endGame(true);
      }
    }

    function drawCursor() {
      if (!isTouching && isPlaying) return;
      ctx.beginPath();
      ctx.arc(currentPos.x, currentPos.y, cursorRadius, 0, Math.PI * 2);
      ctx.fillStyle = mode === 'pre' ? '#ef3b42' : '#2b62a8';
      ctx.shadowColor = mode === 'pre' ? '#ef3b42' : '#2b62a8';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      drawCircuit();
      if (isPlaying && isTouching) {
        updatePhysics();
        drawCursor();
      }
      requestAnimationFrame(loop);
    }

    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function handleStart(clientX, clientY) {
      if (!isPlaying) return;
      const pos = getCanvasCoords(clientX, clientY);
      const startWp = getScaledWaypoints()[0];

      if (Math.hypot(pos.x - startWp.x, pos.y - startWp.y) <= nodeRadius * 1.5) {
        isTouching = true;
        currentPos = { x: startWp.x, y: startWp.y };
        rawPos = pos;

        if (!isTimerRunning) {
          startTime = performance.now();
          isTimerRunning = true;
        }
      }
    }

    function handleMove(clientX, clientY) {
      if (!isPlaying || !isTouching) return;
      rawPos = getCanvasCoords(clientX, clientY);
    }

    function handleEnd() {
      isTouching = false;
    }

    // Touch & Mouse Control Attachments
    canvas.addEventListener('touchstart', (e) => {
      if (e.cancelable) e.preventDefault();
      if (e.touches.length > 0) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isTouching) {
        if (e.cancelable) e.preventDefault();
        if (e.touches.length > 0) {
          handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (isTouching) {
        if (e.cancelable) e.preventDefault();
        handleEnd();
      }
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleStart(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (isTouching) {
        handleMove(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      handleEnd();
    });

    function resetGame() {
      health = 100;
      errors = 0;
      isPlaying = false;
      isTouching = false;
      isTimerRunning = false;
      elapsedTime = 0;
      healthBar.style.width = '100%';
      errorCountEl.textContent = '0';
      timerCountEl.textContent = '0.0s';
      endOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
    }

    function loadLeaderboardFromURLAndStorage() {
      globalScores = [];

      const savedLocal = localStorage.getItem(STORAGE_KEY);
      if (savedLocal) {
        try {
          globalScores = JSON.parse(savedLocal);
        } catch (e) {
          globalScores = [];
        }
      }

      const params = new URLSearchParams(window.location.search);
      const scoresParam = params.get('scores');
      
      if (scoresParam) {
        const entries = scoresParam.split('|');
        entries.forEach(e => {
          const [name, score, timeVal] = e.split(':');
          if (name && score) {
            const decodedName = decodeURIComponent(name);
            const numericScore = parseInt(score);
            const numericTime = timeVal ? parseFloat(timeVal) : 999.9;
            
            const exists = globalScores.some(s => 
              s.name === decodedName && s.score === numericScore && s.time === numericTime
            );

            if (!exists) {
              globalScores.push({ name: decodedName, score: numericScore, time: numericTime, mode: 'post' });
            }
          }
        });
      }

      updateAndPersistScores();
    }

    function updateAndPersistScores() {
      globalScores.sort((a, b) => {
        if (b.score !== a.score) {
          return b.score - a.score;
        }
        return (a.time || 999) - (b.time || 999);
      });

      globalScores = globalScores.slice(0, 10);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(globalScores));

      const topFive = globalScores.slice(0, 5);
      const encodedScores = topFive.map(s => `${encodeURIComponent(s.name)}:${s.score}:${s.time.toFixed(1)}`).join('|');
      const newUrl = `${window.location.origin}${window.location.pathname}?scores=${encodedScores}`;
      
      window.history.replaceState({ path: newUrl }, '', newUrl);
      renderLeaderboard();
    }

    function renderLeaderboard() {
      leaderboardList.innerHTML = '';

      if (globalScores.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-item"><span>No scores available</span></li>';
        return;
      }

      globalScores.forEach((entry, idx) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        
        const displayTime = entry.time ? `${entry.time.toFixed(1)}s` : 'N/A';

        li.innerHTML = `
          <span class="rank">#${idx + 1}</span>
          <span class="name">${entry.name}</span>
          <div class="stats-group">
            <span class="time-tag">⏱ ${displayTime}</span>
            <span class="score">${entry.score}%</span>
          </div>
        `;
        leaderboardList.appendChild(li);
      });
    }

    shareLinkBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        shareLinkBtn.textContent = 'Link Copied!';
        setTimeout(() => { shareLinkBtn.textContent = 'Copy Link'; }, 2000);
      });
    });

    resetScoresBtn.addEventListener('click', () => {
      const confirmReset = confirm('Are you sure you want to clear all leaderboard scores?');
      if (confirmReset) {
        globalScores = [];
        localStorage.removeItem(STORAGE_KEY);
        const cleanUrl = `${window.location.origin}${window.location.pathname}`;
        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        renderLeaderboard();
      }
    });

    function endGame(won) {
      isPlaying = false;
      isTouching = false;
      isTimerRunning = false;
      endOverlay.classList.remove('hidden');
      const finalScore = Math.max(0, Math.floor(health));
      const finalTime = parseFloat(elapsedTime.toFixed(1));

      if (won) {
        playSuccessSound();
        resultTitle.textContent = mode === 'post' ? 'Smooth Navigation!' : 'Pre-Treatment Complete!';
        resultTitle.style.color = mode === 'post' ? 'var(--prolet-blue)' : 'var(--accent-green)';
        resultDesc.textContent = `Score: ${finalScore}% Stability | Time: ${finalTime}s (${Math.floor(errors/3)} wall touches).`;
        
        if (mode === 'post') {
          const playerName = playerNameInput.value.trim() || 'Player';
          globalScores.push({ name: playerName, score: finalScore, time: finalTime, mode: 'post' });
          updateAndPersistScores();
        } else {
          resultDesc.textContent += ' (Pre-Treatment runs are unrecorded).';
        }
      } else {
        resultTitle.textContent = 'Circuit Fault!';
        resultTitle.style.color = 'var(--prolet-red)';
        resultDesc.textContent = 'Excessive tremor caused repeated wall collisions, completely depleting stability meter.';
      }
    }

    startBtn.addEventListener('click', () => {
      startOverlay.classList.add('hidden');
      isPlaying = true;
      isTouching = false;
      const startWp = getScaledWaypoints()[0];
      currentPos = { x: startWp.x, y: startWp.y };
      initAudio();
    });

    retryBtn.addEventListener('click', resetGame);

    function init() {
      resizeCanvas();
      updateOverlayUI();
      loadLeaderboardFromURLAndStorage();
      
      // Double frame-buffer initialization to guarantee proper layout coordinates
      requestAnimationFrame(() => {
        resizeCanvas();
        drawCircuit();
        requestAnimationFrame(() => {
          resizeCanvas();
          loop();
        });
      });
    }

    const observer = new ResizeObserver(() => {
      resizeCanvas();
      drawCircuit();
    });
    observer.observe(document.getElementById('game-container'));

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
