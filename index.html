<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProLet Neural Circuit Precision Challenge - IANCON Demo</title>
  
  <style>
    :root {
      --prolet-blue: #2b62a8;
      --prolet-red: #ef3b42;
      --prolet-dark: #0b0c0e;
      --prolet-card: #18191b;
      --prolet-card-border: #2a2d32;
      
      --accent-green: #2ed573;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--prolet-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 16px 32px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .brand-logo-wrapper {
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 2px solid var(--prolet-blue);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 10px rgba(43, 98, 168, 0.3);
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .brand-logo {
      max-height: 52px;
      max-width: 240px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: none;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1.5px;
      color: var(--prolet-blue);
      text-transform: uppercase;
      font-weight: 800;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 650px;
    }

    .mode-btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--prolet-card);
      color: var(--text-main);
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active-pre {
      border-color: var(--prolet-red);
      box-shadow: 0 0 12px rgba(239, 59, 66, 0.4);
      background: #2a1012;
      color: #fff;
    }

    .mode-btn.active-post {
      border-color: var(--prolet-blue);
      box-shadow: 0 0 12px rgba(43, 98, 168, 0.5);
      background: #0f1d30;
      color: #fff;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--prolet-card-border);
      margin-bottom: 12px;
    }

    .health-container {
      width: 50%;
      background: #000;
      height: 22px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .health-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--prolet-red), var(--prolet-blue));
      transition: width 0.1s linear;
    }

    .metrics {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .metric-box {
      text-align: center;
    }

    .metric-box span.label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      font-weight: bold;
    }

    .metric-box span.val {
      font-size: 1.2rem;
    }

    /* Fixed height for Desktop/PC & Responsive viewports */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 480px;
      background: var(--prolet-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--prolet-card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    @media (max-width: 768px) {
      #game-container {
        height: 52vh;
        min-height: 380px;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 14, 0.93);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .overlay h2 {
      font-size: 1.7rem;
      margin-bottom: 12px;
    }

    .overlay p {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    .input-group input {
      background: #000;
      border: 1px solid var(--prolet-card-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--prolet-blue);
    }

    .btn-action {
      background: var(--prolet-blue);
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 14px 32px;
      border-radius: 24px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43, 98, 168, 0.4);
      transition: all 0.2s;
    }

    .btn-action:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-action:not(:disabled):active {
      background: #20497e;
    }

    /* Video Player Overlay */
    #video-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .skip-video-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid var(--prolet-card-border);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 25;
    }

    .leaderboard-card {
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      border: 1px solid var(--prolet-card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .leaderboard-card h3 {
      font-size: 1.15rem;
      color: var(--prolet-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .leaderboard-actions {
      display: flex;
      gap: 8px;
    }

    .share-btn, .reset-btn {
      background: #2a2d32;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn {
      color: var(--prolet-red);
      border-color: rgba(239, 59, 66, 0.3);
    }

    .share-btn:active, .reset-btn:active {
      background: #333840;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101114;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: var(--text-muted);
      width: 28px;
    }

    .leaderboard-item .name {
      flex: 1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
    }

    .leaderboard-item .stats-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard-item .time-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .leaderboard-item .score {
      font-weight: bold;
      color: var(--accent-green);
      font-size: 1.05rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo-wrapper">
      <img 
        src="logo.png" 
        alt="ProLet Logo" 
        class="brand-logo"
        onerror="this.parentElement.style.display='none';"
      />
    </div>
    <h1>Neural Circuit Challenge</h1>
    <p class="subtitle">Essential Tremor Simulation & Assessment Demo</p>
  </header>

  <div class="controls-panel">
    <button id="btn-pre" class="mode-btn active-pre">Pre-Treatment Experience</button>
    <button id="btn-post" class="mode-btn">Post-ProLet Challenge</button>
  </div>

  <div class="status-bar">
    <div style="width: 45%;">
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block; font-weight: bold; margin-bottom: 2px;">STABILITY</span>
      <div class="health-container" style="width: 100%;">
        <div id="health-bar" class="health-bar"></div>
      </div>
    </div>
    
    <div class="metrics">
      <div class="metric-box" id="time-metric-box">
        <span class="label">TIME</span>
        <span id="timer-count" class="val" style="color: #fff; font-family: monospace;">0.0s</span>
      </div>
      <div class="metric-box">
        <span class="label">ERRORS</span>
        <span id="error-count" class="val" style="color: var(--prolet-red);">0</span>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="mazeCanvas"></canvas>
    
    <!-- Start Overlay -->
    <div id="start-overlay" class="overlay">
      <h2 id="overlay-title">Patient Tremor Simulation</h2>
      <p id="overlay-instructions">Experience how an Essential Tremor patient navigates the circuit. Drag from <strong>GABA</strong> to <strong>GABA Receptor</strong>.</p>
      
      <div class="input-group" id="name-input-container">
        <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="15" />
      </div>

      <button id="start-btn" class="btn-action">Start Experience</button>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay" class="hidden">
      <button id="skip-video-btn" class="skip-video-btn">Skip</button>
      <video id="prolet-video" src="video.mp4" playsinline></video>
    </div>

    <!-- End Overlay -->
    <div id="end-overlay" class="overlay hidden">
      <h2 id="result-title">Circuit Completed!</h2>
      <p id="result-desc"></p>
      <button id="retry-btn" class="btn-action">Try Again</button>
    </div>
  </div>

  <div class="leaderboard-card">
    <div class="leaderboard-header">
      <h3>Post-ProLet Leaderboard</h3>
      <div class="leaderboard-actions">
        <button id="reset-scores-btn" class="reset-btn">Reset Scores</button>
        <button id="share-link-btn" class="share-btn">Copy Link</button>
      </div>
    </div>
    <ul id="leaderboard-list" class="leaderboard-list">
      <li class="leaderboard-item"><span>No scores available</span></li>
    </ul>
  </div>

  <script>
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    
    const btnPre = document.getElementById('btn-pre');
    const btnPost = document.getElementById('btn-post');
    const healthBar = document.getElementById('health-bar');
    const errorCountEl = document.getElementById('error-count');
    const timerCountEl = document.getElementById('timer-count');
    const timeMetricBox = document.getElementById('time-metric-box');
    const startOverlay = document.getElementById('start-overlay');
    const endOverlay = document.getElementById('end-overlay');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const nameInputContainer = document.getElementById('name-input-container');
    const playerNameInput = document.getElementById('player-name');
    const leaderboardList = document.getElementById('leaderboard-list');
    const shareLinkBtn = document.getElementById('share-link-btn');
    const resetScoresBtn = document.getElementById('reset-scores-btn');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayInstructions = document.getElementById('overlay-instructions');

    const videoOverlay = document.getElementById('video-overlay');
    const proletVideo = document.getElementById('prolet-video');
    const skipVideoBtn = document.getElementById('skip-video-btn');

    const STORAGE_KEY = 'prolet_leaderboard_scores';

    let audioCtx = null;
    let lastBuzzTime = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    
    function playBuzzSound() {
      const now = performance.now();
      if (now - lastBuzzTime < 120) return;
      lastBuzzTime = now;

      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.60, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playSuccessSound() {
      initAudio();

      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.1);

        gain.gain.setValueAtTime(0.0, now + idx * 0.1);
        gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.1);
        osc.stop(now + idx * 0.1 + 0.45);
      });
    }

    function triggerHaptic() {
      if ('vibrate' in navigator) navigator.vibrate(40);
    }

    let mode = 'pre';
    let isPlaying = false;
    let isTouching = false;
    let health = 100;
    let errors = 0;
    let globalScores = [];
    
    // Timer Tracking
    let startTime = 0;
    let elapsedTime = 0;
    let isTimerRunning = false;

    let currentPos = { x: 0, y: 0 };
    let rawPos = { x: 0, y: 0 };
    const cursorRadius = 10;
    
    const waypoints = [
      { x: 0.18, y: 0.18 },
      { x: 0.82, y: 0.18 },
      { x: 0.82, y: 0.50 },
      { x: 0.18, y: 0.50 },
      { x: 0.18, y: 0.82 },
      { x: 0.82, y: 0.82 }
    ];
    
    let pathWidth = 52;
    let nodeRadius = 58;

    function resizeCanvas() {
      const rect = gameContainer.getBoundingClientRect();
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      
      if (w > 0 && h > 0) {
        canvas.width = w;
        canvas.height = h;
        
        pathWidth = Math.max(44, Math.min(64, Math.min(w, h) * 0.14));
        nodeRadius = Math.max(48, Math.min(68, Math.min(w, h) * 0.15));

        if (typeof drawCircuit === 'function') {
          drawCircuit();
        }
      }
    }

    const layoutObserver = new ResizeObserver((entries) => {
      for (let entry of entries) {
        if (entry.contentRect.width > 0 && entry.contentRect.height > 0) {
          resizeCanvas();
        }
      }
    });
    layoutObserver.observe(gameContainer);

    playerNameInput.addEventListener('input', () => {
      if (mode === 'post') {
        startBtn.disabled = playerNameInput.value.trim().length === 0;
      }
    });

    function updateOverlayText() {
      if (mode === 'pre') {
        overlayTitle.textContent = "Doctor Experience Mode";
        overlayInstructions.innerHTML = 'Experience the physical effect of Essential Tremor. Drag from <strong style="color:var(--prolet-red)">GABA</strong> to <strong style="color:var(--accent-green)">GABA Receptor</strong>.';
        nameInputContainer.classList.add('hidden');
        timeMetricBox.classList.add('hidden');
        startBtn.textContent = "Start Experience";
        startBtn.disabled = false;
      } else {
        overlayTitle.textContent = "Post-ProLet Precision Challenge";
        overlayInstructions.innerHTML = 'Enter your name to start the timed challenge. Drag from <strong style="color:var(--prolet-blue)">PROLET</strong> to <strong style="color:var(--accent-green)">GABA Receptor</strong>.';
        nameInputContainer.classList.remove('hidden');
        timeMetricBox.classList.remove('hidden');
        startBtn.textContent = "Begin Timed Challenge";
        startBtn.disabled = playerNameInput.value.trim().length === 0;
      }
    }

    function playPostProletVideo(onComplete) {
      videoOverlay.classList.remove('hidden');
      proletVideo.currentTime = 0;
      proletVideo.play().catch(() => {
        closeVideoOverlay();
        onComplete();
      });

      function closeVideoOverlay() {
        proletVideo.pause();
        videoOverlay.classList.add('hidden');
        proletVideo.onended = null;
        skipVideoBtn.onclick = null;
      }

      proletVideo.onended = () => {
        closeVideoOverlay();
        onComplete();
      };

      skipVideoBtn.onclick = () => {
        closeVideoOverlay();
        onComplete();
      };
    }

    btnPre.addEventListener('click', () => {
      mode = 'pre';
      btnPre.classList.add('active-pre');
      btnPost.classList.remove('active-post');
      updateOverlayText();
      resetGame();
    });

    btnPost.addEventListener('click', () => {
      btnPost.classList.add('active-post');
      btnPre.classList.remove('active-pre');
      
      playPostProletVideo(() => {
        mode = 'post';
        updateOverlayText();
        resetGame();
      });
    });

    function applyTremor(pos) {
      if (mode === 'post') return { ...pos };
      const time = performance.now() * 0.025;
      const amplitude = 16.0;
      return {
        x: pos.x + (Math.sin(time * 1.3) + Math.cos(time * 2.1)) * amplitude,
        y: pos.y + (Math.cos(time * 1.7) + Math.sin(time * 2.4)) * amplitude
      };
    }

    function getScaledWaypoints() {
      return waypoints.map(wp => ({ x: wp.x * canvas.width, y: wp.y * canvas.height }));
    }

    function drawOutlinedText(text, x, y, font, fillStyle) {
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.strokeText(text, x, y);
      ctx.fillStyle = fillStyle;
      ctx.fillText(text, x, y);
    }

    function drawCircuit() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scaledWp = getScaledWaypoints();

      ctx.beginPath();
      ctx.moveTo(scaledWp[0].x, scaledWp[0].y);
      for (let i = 1; i < scaledWp.length; i++) ctx.lineTo(scaledWp[i].x, scaledWp[i].y);
      ctx.lineCap = 'round';
