<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ProLet Neural Circuit Precision Challenge - IANCON Demo</title>
  
  <style>
    :root {
      --prolet-blue: #2b62a8;
      --prolet-red: #ef3b42;
      --prolet-dark: #0b0c0e;
      --prolet-card: #18191b;
      --prolet-card-border: #2a2d32;
      
      --accent-green: #2ed573;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--prolet-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* HIGH-CONTRAST LOGO CONTAINER */
    .brand-logo-wrapper {
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 2px solid var(--prolet-blue);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 10px rgba(43, 98, 168, 0.3);
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .brand-logo {
      max-height: 52px;
      max-width: 240px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: none;
    }

    h1 {
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      color: var(--prolet-blue);
      text-transform: uppercase;
      font-weight: 800;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 650px;
    }

    .mode-btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--prolet-card);
      color: var(--text-main);
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active-pre {
      border-color: var(--prolet-red);
      box-shadow: 0 0 12px rgba(239, 59, 66, 0.4);
      background: #2a1012;
      color: #fff;
    }

    .mode-btn.active-post {
      border-color: var(--prolet-blue);
      box-shadow: 0 0 12px rgba(43, 98, 168, 0.5);
      background: #0f1d30;
      color: #fff;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--prolet-card-border);
      margin-bottom: 12px;
    }

    .health-container {
      width: 60%;
      background: #000;
      height: 18px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .health-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--prolet-red), var(--prolet-blue));
      transition: width 0.1s linear;
    }

    .metrics {
      font-size: 0.85rem;
      font-weight: bold;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 50vh;
      min-height: 320px;
      background: var(--prolet-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--prolet-card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 14, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .overlay h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 16px;
    }

    .input-group input {
      background: #000;
      border: 1px solid var(--prolet-card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--prolet-blue);
    }

    .btn-action {
      background: var(--prolet-blue);
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(43, 98, 168, 0.4);
      transition: background 0.2s;
    }

    .btn-action:active {
      background: #20497e;
    }

    /* Leaderboard Card */
    .leaderboard-card {
      width: 100%;
      max-width: 650px;
      background: var(--prolet-card);
      border: 1px solid var(--prolet-card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .leaderboard-card h3 {
      font-size: 1.05rem;
      color: var(--prolet-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .share-btn {
      background: #2a2d32;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .share-btn:active {
      background: #333840;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101114;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: var(--text-muted);
      width: 24px;
    }

    .leaderboard-item .name {
      flex: 1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
    }

    .leaderboard-item .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-pre {
      background: rgba(239, 59, 66, 0.2);
      color: var(--prolet-red);
    }

    .badge-post {
      background: rgba(43, 98, 168, 0.2);
      color: var(--prolet-blue);
    }

    .leaderboard-item .score {
      font-weight: bold;
      color: var(--accent-green);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo-wrapper">
      <img 
        src="logo.png" 
        alt="ProLet Logo" 
        class="brand-logo"
        onerror="this.parentElement.style.display='none';"
      />
    </div>
    <h1>Neural Circuit Challenge</h1>
    <p class="subtitle">Essential Tremor Simulation & Assessment Demo</p>
  </header>

  <div class="controls-panel">
    <button id="btn-pre" class="mode-btn active-pre">Pre-Treatment</button>
    <button id="btn-post" class="mode-btn">Post-ProLet</button>
  </div>

  <div class="status-bar">
    <div>
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">STABILITY</span>
      <div class="health-container">
        <div id="health-bar" class="health-bar"></div>
      </div>
    </div>
    <div class="metrics">
      <span style="font-size: 0.75rem; color: var(--text-muted); display: block; text-align: right;">ERRORS</span>
      <span id="error-count" style="color: var(--prolet-red); font-size: 1.1rem;">0</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="mazeCanvas"></canvas>
    
    <div id="start-overlay" class="overlay">
      <h2>Trace the Circuit</h2>
      <p id="overlay-instructions">Touch and drag from <strong>GABA</strong> to <strong>GABA Receptor</strong> without touching the circuit walls.</p>
      
      <div class="input-group">
        <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="15" />
      </div>

      <button id="start-btn" class="btn-action">Begin Challenge</button>
    </div>

    <div id="end-overlay" class="overlay hidden">
      <h2 id="result-title">Circuit Completed!</h2>
      <p id="result-desc"></p>
      <button id="retry-btn" class="btn-action">Try Again</button>
    </div>
  </div>

  <!-- LINK & LOCAL STORAGE LEADERBOARD -->
  <div class="leaderboard-card">
    <div class="leaderboard-header">
      <h3>Leaderboard</h3>
      <button id="share-link-btn" class="share-btn">Copy Link with Scores</button>
    </div>
    <ul id="leaderboard-list" class="leaderboard-list">
      <li class="leaderboard-item"><span>No scores available</span></li>
    </ul>
  </div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    
    const btnPre = document.getElementById('btn-pre');
    const btnPost = document.getElementById('btn-post');
    const healthBar = document.getElementById('health-bar');
    const errorCountEl = document.getElementById('error-count');
    const startOverlay = document.getElementById('start-overlay');
    const endOverlay = document.getElementById('end-overlay');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const resultTitle = document.getElementById('result-title');
    const resultDesc = document.getElementById('result-desc');
    const playerNameInput = document.getElementById('player-name');
    const leaderboardList = document.getElementById('leaderboard-list');
    const shareLinkBtn = document.getElementById('share-link-btn');
    const overlayInstructions = document.getElementById('overlay-instructions');

    const STORAGE_KEY = 'prolet_leaderboard_scores';

    let audioCtx = null;
    let lastBuzzTime = 0;
    function playBuzzSound() {
      const now = performance.now();
      if (now - lastBuzzTime < 120) return;
      lastBuzzTime = now;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function triggerHaptic() {
      if ('vibrate' in navigator) navigator.vibrate(40);
    }

    let mode = 'pre';
    let isPlaying = false;
    let isTouching = false;
    let health = 100;
    let errors = 0;
    let globalScores = [];
    
    let currentPos = { x: 0, y: 0 };
    let rawPos = { x: 0, y: 0 };
    const cursorRadius = 10;
    
    const waypoints = [
      { x: 0.14, y: 0.15 },
      { x: 0.86, y: 0.15 },
      { x: 0.86, y: 0.50 },
      { x: 0.14, y: 0.50 },
      { x: 0.14, y: 0.85 },
      { x: 0.86, y: 0.85 }
    ];
    let pathWidth = 60;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      pathWidth = Math.min(canvas.width, canvas.height) * 0.13;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateOverlayText() {
      if (mode === 'pre') {
        overlayInstructions.innerHTML = 'Touch and drag from <strong>GABA</strong> to <strong>GABA Receptor</strong> without touching the circuit walls.';
      } else {
        overlayInstructions.innerHTML = 'Touch and drag from <strong>Phenobarbital</strong> to <strong>GABA Receptor</strong> without touching the circuit walls.';
      }
    }

    btnPre.addEventListener('click', () => {
      mode = 'pre';
      btnPre.classList.add('active-pre');
      btnPost.classList.remove('active-post');
      updateOverlayText();
      resetGame();
    });

    btnPost.addEventListener('click', () => {
      mode = 'post';
      btnPost.classList.add('active-post');
      btnPre.classList.remove('active-pre');
      updateOverlayText();
      resetGame();
    });

    function applyTremor(pos) {
      if (mode === 'post') return { ...pos };
      const time = performance.now() * 0.025;
      const amplitude = 16.0;
      return {
        x: pos.x + (Math.sin(time * 1.3) + Math.cos(time * 2.1)) * amplitude,
        y: pos.y + (Math.cos(time * 1.7) + Math.sin(time * 2.4)) * amplitude
      };
    }

    function getScaledWaypoints() {
      return waypoints.map(wp => ({ x: wp.x * canvas.width, y: wp.y * canvas.height }));
    }

    function drawCircuit() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scaledWp = getScaledWaypoints();

      // Outer boundary path
      ctx.beginPath();
      ctx.moveTo(scaledWp[0].x, scaledWp[0].y);
      for (let i = 1; i < scaledWp.length; i++) ctx.lineTo(scaledWp[i].x, scaledWp[i].y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = pathWidth + 10;
      ctx.strokeStyle = '#2a2d32';
      ctx.stroke();

      // Inner corridor path
      ctx.beginPath();
      ctx.moveTo(scaledWp[0].x, scaledWp[0].y);
      for (let i = 1; i < scaledWp.length; i++) ctx.lineTo(scaledWp[i].x, scaledWp[i].y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = pathWidth;
      ctx.strokeStyle = '#101114';
      ctx.stroke();

      // Start Node (Dynamic Label)
      const startLabel = mode === 'pre' ? 'GABA' : 'Phenobarbital';
      ctx.beginPath();
      ctx.arc(scaledWp[0].x, scaledWp[0].y, pathWidth / 2 + 3, 0, Math.PI * 2);
      ctx.fillStyle = '#2b62a8';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(startLabel, scaledWp[0].x, scaledWp[0].y);

      // Goal Node (GABA Receptor)
      const endWp = scaledWp[scaledWp.length - 1];
      ctx.beginPath();
      ctx.arc(endWp.x, endWp.y, pathWidth / 2 + 3, 0, Math.PI * 2);
      ctx.fillStyle = '#2ed573';
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('GABA Receptor', endWp.x, endWp.y);
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function isInsideCorridor(point) {
      const scaledWp = getScaledWaypoints();
      const maxDist = (pathWidth / 2) - cursorRadius;
      for (let i = 0; i < scaledWp.length - 1; i++) {
        if (distToSegment(point, scaledWp[i], scaledWp[i + 1]) <= maxDist) return true;
      }
      for (let i = 0; i < scaledWp.length; i++) {
        if (Math.hypot(point.x - scaledWp[i].x, point.y - scaledWp[i].y) <= maxDist) return true;
      }
      return false;
    }

    function updatePhysics() {
      if (!isPlaying || !isTouching) return;

      const target = applyTremor(rawPos);
      const steps = 15;
      let hitWall = false;

      let nextX = currentPos.x;
      let nextY = currentPos.y;

      for (let i = 1; i <= steps; i++) {
        const testX = currentPos.x + (target.x - currentPos.x) * (i / steps);
        const testY = currentPos.y + (target.y - currentPos.y) * (i / steps);

        if (isInsideCorridor({ x: testX, y: testY })) {
          nextX = testX;
          nextY = testY;
        } else {
          hitWall = true;
          break;
        }
      }

      currentPos.x = nextX;
      currentPos.y = nextY;

      if (hitWall) {
        health = Math.max(0, health - 1.0);
        errors++;
        errorCountEl.textContent = Math.floor(errors / 3);
        healthBar.style.width = health + '%';

        playBuzzSound();
        triggerHaptic();

        if (health <= 0) {
          endGame(false);
          return;
        }
      }

      const scaledWp = getScaledWaypoints();
      const goal = scaledWp[scaledWp.length - 1];
      if (Math.hypot(currentPos.x - goal.x, currentPos.y - goal.y) < pathWidth / 2) {
        endGame(true);
      }
    }

    function drawCursor() {
      if (!isTouching && isPlaying) return;
      ctx.beginPath();
      ctx.arc(currentPos.x, currentPos.y, cursorRadius, 0, Math.PI * 2);
      ctx.fillStyle = mode === 'pre' ? '#ef3b42' : '#2b62a8';
      ctx.shadowColor = mode === 'pre' ? '#ef3b42' : '#2b62a8';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      drawCircuit();
      if (isPlaying && isTouching) {
        updatePhysics();
        drawCursor();
      }
      requestAnimationFrame(loop);
    }

    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      rawPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function handlePointerDown(e) {
      const rect = canvas.getBoundingClientRect();
      const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const startWp = getScaledWaypoints()[0];

      if (Math.hypot(pos.x - startWp.x, pos.y - startWp.y) <= pathWidth) {
        isTouching = true;
        currentPos = { x: startWp.x, y: startWp.y };
        rawPos = pos;
      }
    }

    function handlePointerUp() { isTouching = false; }

    canvas.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);

    function resetGame() {
      health = 100;
      errors = 0;
      isPlaying = false;
      isTouching = false;
      healthBar.style.width = '100%';
      errorCountEl.textContent = '0';
      endOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
    }

    // --- LOCAL STORAGE + URL PARSING FOR PERMANENT SCORES ---
    function loadLeaderboardFromURLAndStorage() {
      globalScores = [];

      // Load saved local scores
      const savedLocal = localStorage.getItem(STORAGE_KEY);
      if (savedLocal) {
        try {
          globalScores = JSON.parse(savedLocal);
        } catch (e) {
          globalScores = [];
        }
      }

      // Check URL parameters
      const params = new URLSearchParams(window.location.search);
      const scoresParam = params.get('scores');
      
      if (scoresParam) {
        const entries = scoresParam.split('|');
        entries.forEach(e => {
          const [name, score, m] = e.split(':');
          if (name && score && m) {
            const decodedName = decodeURIComponent(name);
            const numericScore = parseInt(score);
            
            const exists = globalScores.some(s => 
              s.name === decodedName && s.score === numericScore && s.mode === m
            );

            if (!exists) {
              globalScores.push({ name: decodedName, score: numericScore, mode: m });
            }
          }
        });
      }

      updateAndPersistScores();
    }

    function updateAndPersistScores() {
      globalScores.sort((a, b) => b.score - a.score);
      globalScores = globalScores.slice(0, 10);

      // Save to localStorage
      localStorage.setItem(STORAGE_KEY, JSON.stringify(globalScores));

      // Update URL parameters
      const topFive = globalScores.slice(0, 5);
      const encodedScores = topFive.map(s => `${encodeURIComponent(s.name)}:${s.score}:${s.mode}`).join('|');
      const newUrl = `${window.location.origin}${window.location.pathname}?scores=${encodedScores}`;
      
      window.history.replaceState({ path: newUrl }, '', newUrl);

      renderLeaderboard();
    }

    function renderLeaderboard() {
      leaderboardList.innerHTML = '';

      if (globalScores.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-item"><span>No scores available</span></li>';
        return;
      }

      globalScores.forEach((entry, idx) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        const badgeClass = entry.mode === 'pre' ? 'badge-pre' : 'badge-post';
        
        li.innerHTML = `
          <span class="rank">#${idx + 1}</span>
          <span class="name">${entry.name}</span>
          <span class="badge ${badgeClass}">${entry.mode}</span>
          <span class="score">${entry.score}%</span>
        `;
        leaderboardList.appendChild(li);
      });
    }

    shareLinkBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        shareLinkBtn.textContent = 'Link Copied!';
        setTimeout(() => { shareLinkBtn.textContent = 'Copy Link with Scores'; }, 2000);
      });
    });

    function endGame(won) {
      isPlaying = false;
      endOverlay.classList.remove('hidden');
      const finalScore = Math.max(0, Math.floor(health));

      if (won) {
        resultTitle.textContent = mode === 'post' ? 'Smooth Navigation!' : 'Challenge Complete!';
        resultTitle.style.color = mode === 'post' ? 'var(--prolet-blue)' : 'var(--accent-green)';
        resultDesc.textContent = `Score: ${finalScore}% Stability Remaining (${Math.floor(errors/3)} wall touches).`;
        
        const playerName = playerNameInput.value.trim() || 'Player';
        globalScores.push({ name: playerName, score: finalScore, mode: mode });
        updateAndPersistScores();
      } else {
        resultTitle.textContent = 'Circuit Fault!';
        resultTitle.style.color = 'var(--prolet-red)';
        resultDesc.textContent = 'Excessive tremor caused repeated wall collisions, completely depleting stability meter.';
      }
    }

    startBtn.addEventListener('click', () => {
      startOverlay.classList.add('hidden');
      isPlaying = true;
      const startWp = getScaledWaypoints()[0];
      currentPos = { x: startWp.x, y: startWp.y };
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    });

    retryBtn.addEventListener('click', resetGame);

    // Initial setup
    updateOverlayText();
    loadLeaderboardFromURLAndStorage();
    loop();
  </script>
</body>
</html>
